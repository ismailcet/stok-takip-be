spring:
  application:
    name: stok-takip-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stok_takip}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Ic110711.}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-production-min-32-bytes}
    expiration-ms: 604800000
  low-stock-threshold: 5